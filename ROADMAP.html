		</script>

		<script>
			(function () {
				'use strict';

				var STORAGE_KEY = 'kiku-roadmap-board-v1';
				var roadmapDataNode = document.getElementById('roadmap-data');
				var sourceRoadmap = deepFreeze(JSON.parse(roadmapDataNode.textContent));
				var phaseIds = sourceRoadmap.phases.map(function (phase) {
					return phase.id;
				});
				var featureById = new Map(
					sourceRoadmap.features.map(function (feature) {
						return [feature.id, feature];
					})
				);
				var phaseById = new Map(
					sourceRoadmap.phases.map(function (phase) {
						return [phase.id, phase];
					})
				);
				var sourceBoard = createSourceBoard();
				var boardState = loadBoardState();
				var draggingId = null;
				var dragJustEnded = false;
				var activeFeatureId = null;
				var modalReturnTarget = null;
				var previousBodyOverflow = '';
				var toastTimer = null;

				assertSourceRoadmap();
				renderSummary();
				renderBoard();
				bindEvents();

				function deepFreeze(value) {
					if (!value || typeof value !== 'object' || Object.isFrozen(value)) return value;
					Object.freeze(value);
					Object.keys(value).forEach(function (key) {
						deepFreeze(value[key]);
					});
					return value;
				}

				function assertSourceRoadmap() {
					var summary = sourceRoadmap.summary;
					if (summary.phaseCount !== sourceRoadmap.phases.length) {
						throw new Error('Roadmap phase count does not match source data.');
					}
					if (summary.featureCount !== sourceRoadmap.features.length) {
						throw new Error('Roadmap feature count does not match source data.');
					}
					if (featureById.size !== sourceRoadmap.features.length) {
						throw new Error('Roadmap feature IDs must be unique.');
					}

					var priorities = countBy(
						sourceRoadmap.features.map(function (feature) {
							return feature.priority;
						})
					);
					Object.keys(summary.priorityBreakdown).forEach(function (priority) {
						if ((priorities[priority] || 0) !== summary.priorityBreakdown[priority]) {
							throw new Error('Roadmap priority count does not match source data.');
						}
					});

					sourceRoadmap.features.forEach(function (feature) {
						var matchingPhases = sourceRoadmap.phases.filter(function (phase) {
							return phase.label === feature.sourcePhase;
						});
						if (matchingPhases.length !== 1) {
							throw new Error('Every feature must map to exactly one source phase.');
						}
						if (!feature.branch || /\s/.test(feature.branch)) {
							throw new Error('Every feature must have exactly one valid branch name.');
						}
					});
				}

				function createSourceBoard() {
					var next = {};
					sourceRoadmap.phases.forEach(function (phase) {
						next[phase.id] = sourceRoadmap.features
							.filter(function (feature) {
								return feature.sourcePhase === phase.label;
							})
							.map(function (feature) {
								return feature.id;
							});
					});
					return next;
				}

				function cloneBoard(board) {
					var next = {};
					phaseIds.forEach(function (phaseId) {
						next[phaseId] = board[phaseId].slice();
					});
					return next;
				}

				function validateSavedBoard(saved) {
					if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return false;
					var savedKeys = Object.keys(saved).sort();
					var expectedKeys = phaseIds.slice().sort();
					if (savedKeys.length !== expectedKeys.length) return false;
					if (
						savedKeys.some(function (key, index) {
							return key !== expectedKeys[index] || !Array.isArray(saved[key]);
						})
					) {
						return false;
					}

					var allIds = phaseIds.reduce(function (ids, phaseId) {
						return ids.concat(saved[phaseId]);
					}, []);
					if (allIds.length !== sourceRoadmap.features.length) return false;
					if (new Set(allIds).size !== allIds.length) return false;
					return allIds.every(function (id) {
						return featureById.has(id);
					});
				}

				function loadBoardState() {
					try {
						var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
						return validateSavedBoard(saved) ? cloneBoard(saved) : cloneBoard(sourceBoard);
					} catch (error) {
						return cloneBoard(sourceBoard);
					}
				}

				function saveBoardState() {
					try {
						localStorage.setItem(STORAGE_KEY, JSON.stringify(boardState));
					} catch (error) {
						showToast('Board moved, but this browser could not save the layout.');
					}
				}

				function countBy(values) {
					return values.reduce(function (counts, value) {
						counts[value] = (counts[value] || 0) + 1;
						return counts;
					}, {});
				}

				function escapeHtml(value) {
					return String(value).replace(/[&<>"']/g, function (character) {
						return {
							'&': '&amp;',
							'<': '&lt;',
							'>': '&gt;',
							'"': '&quot;',
							"'": '&#039;'
						}[character];
					});
				}

				function icon(name, width, className) {
					return (
						'<iconify-icon icon="' +
						escapeHtml(name) +
						'" width="' +
						String(width) +
						'" height="' +
						String(width) +
						'" class="' +
						escapeHtml(className || '') +
						'" aria-hidden="true"></iconify-icon>'
					);
				}

				function priorityClasses(priority) {
					return {
						Must: 'border-rose-200 bg-[#FFE4E6] text-rose-800',
						Should: 'border-amber-200 bg-[#FFF0E3] text-amber-800',
						Could: 'border-emerald-200 bg-[#E1F7F1] text-emerald-800',
						Wont: 'border-slate-200 bg-slate-100 text-slate-600'
					}[priority];
				}

				function badge(label, className) {
					return (
						'<span class="inline-flex items-center rounded-full border px-2 py-1 text-xs font-medium ' +
						className +
						'">' +
						escapeHtml(label) +
						'</span>'
					);
				}

				function summaryCell(label, value, detail) {
					return (
						'<div class="bg-white px-4 py-3">' +
						'<p class="text-xs font-medium uppercase tracking-wider text-slate-400">' +
						escapeHtml(label) +
						'</p>' +
						'<p class="mt-1 text-lg font-semibold tracking-tight text-slate-950">' +
						escapeHtml(value) +
						'</p>' +
						'<p class="mt-1 text-xs leading-5 text-slate-500">' +
						escapeHtml(detail) +
						'</p>' +
						'</div>'
					);
				}

				function renderSummary() {
					var summary = sourceRoadmap.summary;
					document.getElementById('roadmap-vision').textContent = summary.vision;
					document.getElementById('roadmap-context').textContent =
						'Current maturity: ' + summary.currentMaturity + '. ' + summary.evidenceBasis;
					document.getElementById('summary-grid').innerHTML =
						summaryCell('Project', summary.project, summary.currentMaturity) +
						summaryCell('Plan size', summary.featureCount + ' features', summary.phaseCount + ' intentional phases') +
						summaryCell(
							'Competitor analysis',
							summary.competitorAnalysisUsed ? 'Used' : 'Not used',
							summary.competitorPainPointFeatureCount + ' competitor-pain features'
						) +
						summaryCell('Scope rule', 'Outcome first', 'One independently deliverable branch per feature');

					document.getElementById('priority-summary').innerHTML = Object.keys(
						summary.priorityBreakdown
					)
						.map(function (priority) {
							return badge(
								priority + ' · ' + summary.priorityBreakdown[priority],
								priorityClasses(priority)
							);
						})
						.join('');
				}

				function currentPhaseForFeature(featureId) {
					for (var index = 0; index < phaseIds.length; index += 1) {
						if (boardState[phaseIds[index]].indexOf(featureId) !== -1) {
							return phaseById.get(phaseIds[index]);
						}
					}
					return null;
				}

				function renderCard(feature) {
					return (
						'<article ' +
						'class="group cursor-grab rounded-lg border border-slate-200 bg-white p-4 transition hover:border-[#895DDD]/40 focus:outline-none focus:ring-2 focus:ring-[#895DDD]/30 active:cursor-grabbing" ' +
						'data-feature-id="' +
						escapeHtml(feature.id) +
						'" draggable="true" role="button" tabindex="0" aria-label="Open details for ' +
						escapeHtml(feature.title) +
						'">' +
						'<div class="flex items-start gap-3">' +
						'<span class="mt-0.5 inline-flex shrink-0 text-slate-300 transition group-hover:text-[#895DDD]" title="Drag to reorder or move">' +
						icon('solar:hamburger-menu-linear', 18, '') +
						'</span>' +
						'<div class="min-w-0 flex-1">' +
						'<div class="flex flex-wrap items-center gap-1.5">' +
						badge(feature.priority, priorityClasses(feature.priority)) +
						badge(feature.status, 'border-violet-200 bg-[#F0EAFF] text-violet-800') +
						'</div>' +
						'<h3 class="mt-3 text-sm font-semibold leading-5 text-slate-950">' +
						escapeHtml(feature.title) +
						'</h3>' +
						'<p class="mt-2 max-h-16 overflow-hidden text-xs leading-5 text-slate-600">' +
						escapeHtml(feature.description) +
						'</p>' +
						'</div>' +
						'</div>' +
						'<div class="mt-4 grid grid-cols-2 gap-2 border-t border-slate-100 pt-3">' +
						'<div><p class="text-xs uppercase tracking-wider text-slate-400">Complexity</p><p class="mt-1 text-xs font-medium text-slate-700">' +
						escapeHtml(feature.complexity) +
						'</p></div>' +
						'<div><p class="text-xs uppercase tracking-wider text-slate-400">Impact</p><p class="mt-1 text-xs font-medium text-slate-700">' +
						escapeHtml(feature.impact) +
						'</p></div>' +
						'</div>' +
						'<div class="mt-3 flex items-center gap-2 rounded-md bg-slate-50 px-2.5 py-2 text-xs text-slate-600">' +
						icon('solar:branching-paths-down-linear', 16, 'shrink-0 text-[#895DDD]') +
						'<code class="min-w-0 truncate font-medium">' +
						escapeHtml(feature.branch) +
						'</code>' +
						'</div>' +
						'</article>'
					);
				}

				function phaseImpactBlock(phase) {
					var impact = phase.phaseExpectedImpact;
					return (
						'<div class="mt-4 border-t border-slate-200 pt-4">' +
						'<p class="text-xs font-semibold uppercase tracking-wider text-slate-700">Phase expected impact</p>' +
						'<dl class="mt-3 space-y-3">' +
						impactRow('Primary outcome', impact.primaryOutcome) +
						impactRow('Operational outcome', impact.operationalOutcome) +
						impactRow('Validation goal', impact.validationGoal) +
						impactRow('Exit signal', impact.exitSignal) +
						'</dl>' +
						'</div>'
					);
				}

				function impactRow(label, value) {
					return (
						'<div><dt class="text-xs font-medium text-slate-500">' +
						escapeHtml(label) +
						'</dt><dd class="mt-1 text-xs leading-5 text-slate-600">' +
						escapeHtml(value) +
						'</dd></div>'
					);
				}

				function renderPhase(phase) {
					var featureIds = boardState[phase.id];
					var cards = featureIds
						.map(function (featureId) {
							return renderCard(featureById.get(featureId));
						})
						.join('');
					var milestones = phase.milestones
						.map(function (milestone) {
							return (
								'<li class="flex gap-2 text-xs leading-5 text-slate-600">' +
								'<span class="mt-2 h-1 w-1 shrink-0 rounded-full bg-[#895DDD]" aria-hidden="true"></span>' +
								'<span>' +
								escapeHtml(milestone) +
								'</span></li>'
							);
						})
						.join('');

					return (
						'<section class="flex min-h-[720px] flex-col rounded-lg border border-slate-200 bg-slate-50/70 p-3" data-phase-id="' +
						escapeHtml(phase.id) +
						'" aria-labelledby="' +
						escapeHtml(phase.id) +
						'-title">' +
						'<header class="border-b border-slate-200 px-1 pb-4">' +
						'<div class="flex items-start justify-between gap-3">' +
						'<div>' +
						'<p class="text-xs font-medium uppercase tracking-widest text-[#895DDD]">' +
						escapeHtml(phase.label.split(':')[0]) +
						'</p>' +
						'<h2 id="' +
						escapeHtml(phase.id) +
						'-title" class="mt-1 text-base font-semibold text-slate-950">' +
						escapeHtml(phase.label.split(': ').slice(1).join(': ')) +
						'</h2>' +
						'</div>' +
						'<span class="inline-flex min-w-7 items-center justify-center rounded-full border border-slate-200 bg-white px-2 py-1 text-xs font-semibold text-slate-700" aria-label="' +
						featureIds.length +
						' features">' +
						featureIds.length +
						'</span>' +
						'</div>' +
						'<p class="mt-3 text-xs leading-5 text-slate-600">' +
						escapeHtml(phase.purpose) +
						'</p>' +
						'<div class="mt-3 rounded-md border border-[#895DDD]/15 bg-[#F0EAFF]/60 p-3">' +
						'<p class="text-xs font-medium text-[#6F3FCA]">Target outcome</p>' +
						'<p class="mt-1 text-xs leading-5 text-slate-700">' +
						escapeHtml(phase.targetOutcome) +
						'</p>' +
						'</div>' +
						'<div class="mt-3">' +
						'<p class="text-xs font-medium uppercase tracking-wider text-slate-400">Milestones</p>' +
						'<ul class="mt-2 space-y-2">' +
						milestones +
						'</ul>' +
						'</div>' +
						'</header>' +
						'<div class="min-h-28 flex-1 space-y-3 py-3" data-dropzone="' +
						escapeHtml(phase.id) +
						'">' +
						cards +
						'</div>' +
						phaseImpactBlock(phase) +
						'</section>'
					);
				}

				function renderBoard() {
					document.getElementById('roadmap-board').innerHTML = sourceRoadmap.phases
						.map(renderPhase)
						.join('');
				}

				function bindEvents() {
					var board = document.getElementById('roadmap-board');
					var modalRoot = document.getElementById('modal-root');

					board.addEventListener('click', function (event) {
						var card = event.target.closest('[data-feature-id]');
						if (!card || dragJustEnded) return;
						openModal(card.dataset.featureId, card);
					});

					board.addEventListener('keydown', function (event) {
						var card = event.target.closest('[data-feature-id]');
						if (!card || (event.key !== 'Enter' && event.key !== ' ')) return;
						event.preventDefault();
						openModal(card.dataset.featureId, card);
					});

					board.addEventListener('dragstart', handleDragStart);
					board.addEventListener('dragend', handleDragEnd);
					board.addEventListener('dragover', handleDragOver);
					board.addEventListener('dragleave', handleDragLeave);
					board.addEventListener('drop', handleDrop);

					document.getElementById('reset-board').addEventListener('click', resetBoard);

					modalRoot.addEventListener('click', function (event) {
						var closeControl = event.target.closest('[data-close-modal]');
						if (closeControl || event.target.id === 'feature-modal-backdrop') {
							closeModal();
							return;
						}

						var copyControl = event.target.closest('[data-copy-action]');
						if (!copyControl || !activeFeatureId) return;
						var feature = featureById.get(activeFeatureId);
						if (copyControl.dataset.copyAction === 'prompt') {
							handleCopy(copyControl, buildImplementationPrompt(feature));
						} else if (copyControl.dataset.copyAction === 'branch') {
							handleCopy(copyControl, feature.branch);
						}
					});

					document.addEventListener('keydown', function (event) {
						if (event.key === 'Escape' && activeFeatureId) closeModal();
						if (event.key === 'Tab' && activeFeatureId) trapModalFocus(event);
					});
				}

				function trapModalFocus(event) {
					var modal = document.querySelector('[role="dialog"]');
					if (!modal) return;
					var controls = Array.from(
						modal.querySelectorAll(
							'button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'
						)
					).filter(function (control) {
						return control.getClientRects().length > 0;
					});
					if (!controls.length) return;
					var firstControl = controls[0];
					var lastControl = controls[controls.length - 1];
					if (event.shiftKey && document.activeElement === firstControl) {
						event.preventDefault();
						lastControl.focus();
					} else if (!event.shiftKey && document.activeElement === lastControl) {
						event.preventDefault();
						firstControl.focus();
					}
				}

				function handleDragStart(event) {
					var card = event.target.closest('[data-feature-id]');
					if (!card) return;
					draggingId = card.dataset.featureId;
					dragJustEnded = true;
					card.classList.add('opacity-50', 'scale-[0.99]');
					event.dataTransfer.effectAllowed = 'move';
					event.dataTransfer.setData('text/plain', draggingId);
				}

				function handleDragEnd(event) {
					var card = event.target.closest('[data-feature-id]');
					if (card) card.classList.remove('opacity-50', 'scale-[0.99]');
					clearDropStates();
					draggingId = null;
					window.setTimeout(function () {
						dragJustEnded = false;
					}, 80);
				}

				function handleDragOver(event) {
					if (!draggingId) return;
					var column = event.target.closest('[data-phase-id]');
					if (!column) return;
					event.preventDefault();
					event.dataTransfer.dropEffect = 'move';
					clearDropStates();
					column.classList.add('border-[#895DDD]', 'bg-[#F7F3FF]');
				}

				function handleDragLeave(event) {
					var column = event.target.closest('[data-phase-id]');
					if (!column || column.contains(event.relatedTarget)) return;
					column.classList.remove('border-[#895DDD]', 'bg-[#F7F3FF]');
				}

				function handleDrop(event) {
					if (!draggingId) return;
					var column = event.target.closest('[data-phase-id]');
					if (!column) return;
					event.preventDefault();

					var destinationPhaseId = column.dataset.phaseId;
					var targetCard = event.target.closest('[data-feature-id]');
					var targetId =
						targetCard && targetCard.dataset.featureId !== draggingId
							? targetCard.dataset.featureId
							: null;
					var next = cloneBoard(boardState);

					phaseIds.forEach(function (phaseId) {
						next[phaseId] = next[phaseId].filter(function (featureId) {
							return featureId !== draggingId;
						});
					});

					var destination = next[destinationPhaseId];
					if (targetId) {
						var insertionIndex = destination.indexOf(targetId);
						var bounds = targetCard.getBoundingClientRect();
						if (event.clientY > bounds.top + bounds.height / 2) insertionIndex += 1;
						destination.splice(Math.max(0, insertionIndex), 0, draggingId);
					} else {
						destination.push(draggingId);
					}

					boardState = next;
					saveBoardState();
					renderBoard();
					clearDropStates();
					draggingId = null;
					window.setTimeout(function () {
						dragJustEnded = false;
					}, 80);
				}

				function clearDropStates() {
					document.querySelectorAll('[data-phase-id]').forEach(function (column) {
						column.classList.remove('border-[#895DDD]', 'bg-[#F7F3FF]');
					});
				}

				function resetBoard() {
					boardState = cloneBoard(sourceBoard);
					try {
						localStorage.removeItem(STORAGE_KEY);
					} catch (error) {
						showToast('The source order is restored for this session.');
					}
					renderBoard();
					showToast('Source roadmap order restored.');
				}

				function listHtml(items) {
					if (!items.length) {
						return '<p class="text-xs leading-5 text-slate-500">None.</p>';
					}
					return (
						'<ul class="space-y-2">' +
						items
							.map(function (item) {
								return (
									'<li class="flex gap-2 text-xs leading-5 text-slate-700">' +
									'<span class="mt-2 h-1 w-1 shrink-0 rounded-full bg-[#895DDD]" aria-hidden="true"></span>' +
									'<span>' +
									escapeHtml(item) +
									'</span></li>'
								);
							})
							.join('') +
						'</ul>'
					);
				}

				function detailSection(title, content) {
					return (
						'<section class="border-t border-slate-200 pt-5">' +
						'<h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500">' +
						escapeHtml(title) +
						'</h3>' +
						'<div class="mt-3">' +
						content +
						'</div>' +
						'</section>'
					);
				}

				function textDetail(label, value) {
					return (
						'<div>' +
						'<dt class="text-xs font-medium text-slate-500">' +
						escapeHtml(label) +
						'</dt>' +
						'<dd class="mt-1 text-xs leading-5 text-slate-800">' +
						escapeHtml(value) +
						'</dd>' +
						'</div>'
					);
				}

				function openModal(featureId, returnTarget) {
					var feature = featureById.get(featureId);
					if (!feature) return;
					var currentPhase = currentPhaseForFeature(featureId);
					activeFeatureId = featureId;
					modalReturnTarget = returnTarget;
					previousBodyOverflow = document.body.style.overflow;
					document.body.style.overflow = 'hidden';

					var impact = feature.expectedImpact;
					var metadata =
						textDetail('Source phase', feature.sourcePhase) +
						textDetail('Current board phase', currentPhase ? currentPhase.label : 'Unknown') +
						textDetail('Priority', feature.priority) +
						textDetail('Complexity', feature.complexity) +
						textDetail('Impact', feature.impact) +
						textDetail('Impact confidence', feature.impactConfidence) +
						textDetail('Status', feature.status) +
						textDetail('Branch', feature.branch);
					var expectedImpact =
						'<dl class="grid gap-4 md:grid-cols-2">' +
						textDetail('User impact', impact.userImpact) +
						textDetail('Business or product impact', impact.businessProductImpact) +
						textDetail('Technical or operational impact', impact.technicalOperationalImpact) +
						textDetail('Time horizon', impact.timeHorizon) +
						'</dl>' +
						'<div class="mt-4"><p class="text-xs font-medium text-slate-500">Success signals</p><div class="mt-2">' +
						listHtml(impact.successSignals) +
						'</div></div>';

					document.getElementById('modal-root').innerHTML =
						'<div id="feature-modal-backdrop" class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/45 p-3 sm:p-6">' +
						'<section role="dialog" aria-modal="true" aria-labelledby="feature-modal-title" class="flex max-h-[92vh] w-full max-w-4xl flex-col overflow-hidden rounded-lg border border-slate-200 bg-white shadow-xl">' +
						'<header class="flex items-start justify-between gap-5 border-b border-slate-200 px-5 py-4 sm:px-6">' +
						'<div class="min-w-0">' +
						'<div class="flex flex-wrap gap-2">' +
						badge(feature.priority, priorityClasses(feature.priority)) +
						badge(feature.status, 'border-violet-200 bg-[#F0EAFF] text-violet-800') +
						'</div>' +
						'<h2 id="feature-modal-title" class="mt-3 text-xl font-semibold tracking-tight text-slate-950">' +
						escapeHtml(feature.title) +
						'</h2>' +
						'<p class="mt-2 text-xs leading-5 text-slate-600">' +
						escapeHtml(feature.description) +
						'</p>' +
						'</div>' +
						'<button type="button" data-close-modal aria-label="Close feature details" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-slate-200 text-slate-500 transition hover:border-[#895DDD]/40 hover:text-[#895DDD] focus:outline-none focus:ring-2 focus:ring-[#895DDD]/30">' +
						icon('solar:close-circle-linear', 20, '') +
						'</button>' +
						'</header>' +
						'<div class="overflow-y-auto px-5 py-5 sm:px-6">' +
						'<div class="space-y-5">' +
						'<dl class="grid gap-4 rounded-lg border border-slate-200 bg-slate-50 p-4 sm:grid-cols-2 lg:grid-cols-4">' +
						metadata +
						'</dl>' +
						detailSection('Problem solved', '<p class="text-xs leading-5 text-slate-700">' + escapeHtml(feature.problemSolved) + '</p>') +
						detailSection('Who benefits', '<p class="text-xs leading-5 text-slate-700">' + escapeHtml(feature.whoBenefits) + '</p>') +
						detailSection('Rationale and sequencing', '<p class="text-xs leading-5 text-slate-700">' + escapeHtml(feature.rationale) + '</p>') +
						detailSection('Dependencies', listHtml(feature.dependencies)) +
						detailSection('Expected Impact / Success Definition (ผลลัพธ์ที่ตรวจสอบได้)', expectedImpact) +
						detailSection('Acceptance Criteria', listHtml(feature.acceptanceCriteria)) +
						detailSection('User Stories', listHtml(feature.userStories)) +
						'</div>' +
						'</div>' +
						'<footer class="flex flex-col-reverse gap-2 border-t border-slate-200 bg-slate-50 px-5 py-4 sm:flex-row sm:justify-end sm:px-6">' +
						'<button type="button" data-copy-action="branch" data-default-label="Copy Branch Name" class="inline-flex items-center justify-center gap-2 rounded-md border border-slate-300 bg-white px-4 py-2.5 text-xs font-medium text-slate-700 transition hover:border-[#895DDD]/40 hover:text-[#895DDD] focus:outline-none focus:ring-2 focus:ring-[#895DDD]/30">' +
						icon('solar:branching-paths-down-linear', 17, '') +
						'<span data-button-label>Copy Branch Name</span>' +
						'</button>' +
						'<button type="button" data-copy-action="prompt" data-default-label="Copy Prompt" class="inline-flex items-center justify-center gap-2 rounded-md border border-[#895DDD] bg-[#895DDD] px-4 py-2.5 text-xs font-medium text-white transition hover:bg-[#7546CC] focus:outline-none focus:ring-2 focus:ring-[#895DDD]/30">' +
						icon('solar:copy-linear', 17, '') +
						'<span data-button-label>Copy Prompt</span>' +
						'</button>' +
						'</footer>' +
						'</section>' +
						'</div>';

					window.requestAnimationFrame(function () {
						var closeButton = document.querySelector('[data-close-modal]');
						if (closeButton) closeButton.focus();
					});
				}

				function closeModal() {
					if (!activeFeatureId) return;
					document.getElementById('modal-root').innerHTML = '';
					activeFeatureId = null;
					document.body.style.overflow = previousBodyOverflow;
					if (modalReturnTarget && document.contains(modalReturnTarget)) {
						modalReturnTarget.focus();
					}
					modalReturnTarget = null;
				}

				function buildImplementationPrompt(feature) {
					return [
						'Implement this Kiku roadmap feature and only this feature.',
						'',
						'Feature: ' + feature.title,
						'Implementation objective: Deliver the capability described below without unrelated scope expansion.',
						'Description: ' + feature.description,
						'Problem solved: ' + feature.problemSolved,
						'Beneficiaries: ' + feature.whoBenefits,
						'Rationale: ' + feature.rationale,
						'Priority: ' + feature.priority,
						'Complexity: ' + feature.complexity,
						'Impact: ' + feature.impact,
						'Impact confidence: ' + feature.impactConfidence,
						'Source phase: ' + feature.sourcePhase,
						'Dependencies: ' + (feature.dependencies.length ? feature.dependencies.join('; ') : 'None'),
						'Exact branch name: ' + feature.branch,
						'Status: ' + feature.status,
						'',
						'Expected Impact / Success Definition (ผลลัพธ์ที่ตรวจสอบได้)',
						'User impact: ' + feature.expectedImpact.userImpact,
						'Business or product impact: ' + feature.expectedImpact.businessProductImpact,
						'Technical or operational impact: ' + feature.expectedImpact.technicalOperationalImpact,
						'Success signals:',
						feature.expectedImpact.successSignals
							.map(function (signal) {
								return '- ' + signal;
							})
							.join('\n'),
						'Time horizon: ' + feature.expectedImpact.timeHorizon,
						'',
						'Acceptance Criteria',
						feature.acceptanceCriteria
							.map(function (criterion) {
								return '- ' + criterion;
							})
							.join('\n'),
						'',
						'User Stories',
						feature.userStories
							.map(function (story) {
								return '- ' + story;
							})
							.join('\n'),
						'',
						'Implementation constraints:',
						'- Implement only this feature without unrelated scope expansion.',
						'- Preserve existing contracts unless a listed acceptance criterion requires a scoped change.',
						'- Verify every acceptance criterion before completion and report any unverified item explicitly.'
					].join('\n');
				}

				async function copyText(value) {
					if (navigator.clipboard && window.isSecureContext) {
						try {
							await navigator.clipboard.writeText(value);
							return true;
						} catch (error) {
							// Continue to the required restricted-preview fallback.
						}
					}

					var textarea = document.createElement('textarea');
					textarea.value = value;
					textarea.setAttribute('readonly', '');
					textarea.style.position = 'fixed';
					textarea.style.left = '-9999px';
					textarea.style.top = '0';
					textarea.style.opacity = '0';
					document.body.appendChild(textarea);
					try {
						textarea.focus();
						textarea.select();
						textarea.setSelectionRange(0, textarea.value.length);
						return document.execCommand('copy');
					} catch (error) {
						return false;
					} finally {
						textarea.remove();
					}
				}

				async function handleCopy(button, value) {
					var label = button.querySelector('[data-button-label]');
					var defaultLabel = button.dataset.defaultLabel;
					button.disabled = true;
					var copied = await copyText(value);
					label.textContent = copied ? 'Copied' : 'Copy failed';
					showToast(copied ? defaultLabel + ' copied.' : 'Copy failed. Select the content manually.');
					window.setTimeout(function () {
						label.textContent = defaultLabel;
						button.disabled = false;
					}, 1600);
				}

				function showToast(message) {
					var toast = document.getElementById('toast');
					window.clearTimeout(toastTimer);
					toast.textContent = message;
					toast.classList.remove('opacity-0');
					toast.classList.add('opacity-100');
					toastTimer = window.setTimeout(function () {
						toast.classList.remove('opacity-100');
						toast.classList.add('opacity-0');
					}, 2200);
				}
			})();
		</script>
	</body>
</html>
